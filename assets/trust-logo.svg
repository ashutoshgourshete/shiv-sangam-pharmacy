<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <path id="circlePathTop" d="M 38,150 A 112,112 0 0,1 262,150" fill="none" />
    <path id="circlePathBottom" d="M 68,175 A 112,112 0 0,0 232,175" fill="none" />
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="150" cy="150" r="142" fill="#FFFFFF" stroke="#9A5B27" stroke-width="3.5" filter="url(#logoShadow)" />
  <circle cx="150" cy="150" r="134" fill="#FAF7F2" stroke="#B87D4B" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Outer Ring Circular Text -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="900" fill="#6B3310" letter-spacing="2.2">
    <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">
      VIVEKANAND YUVAK MANDAL
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="900" fill="#6B3310" letter-spacing="4">
    <textPath href="#circlePathBottom" startOffset="50%" text-anchor="middle">
      LATUR
    </textPath>
  </text>

  <!-- Inner Circle Separator -->
  <circle cx="150" cy="150" r="86" fill="#FFFFFF" stroke="#9A5B27" stroke-width="2" />

  <!-- Core Emblem matching User Screenshot: • ) V ( • -->
  <g transform="translate(150, 150)">
    <!-- Top Figure -->
    <circle cx="0" cy="-56" r="6.5" fill="#78350F" />
    <path d="M -22,-36 C -12,-48 12,-48 22,-36 C 14,-31 -14,-31 -22,-36 Z" fill="#9A5B27" />
    <path d="M -14,-40 C -8,-45 8,-45 14,-40" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Left Dot & Arc: • ) -->
    <circle cx="-54" cy="0" r="6.5" fill="#78350F" />
    <path d="M -36,-22 C -48,-12 -48,12 -36,22 C -31,14 -31,-14 -36,-22 Z" fill="#9A5B27" />

    <!-- Right Arc & Dot: ( • -->
    <path d="M 36,-22 C 48,-12 48,12 36,22 C 31,14 31,-14 36,-22 Z" fill="#9A5B27" />
    <circle cx="54" cy="0" r="6.5" fill="#78350F" />

    <!-- Bottom Figure -->
    <path d="M -22,36 C -12,48 12,48 22,36 C 14,31 -14,31 -22,36 Z" fill="#9A5B27" />
    <circle cx="0" cy="56" r="6.5" fill="#78350F" />

    <!-- Center Bold Letter 'V' -->
    <text x="0" y="11" font-family="'Times New Roman', 'Cinzel', serif" font-size="34" font-weight="900" fill="#78350F" text-anchor="middle">V</text>
  </g>
</svg>
